<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UniFi Sonar</title>
  <meta name="theme-color" content="#090E18">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2339D8F4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M19.07 4.93A10 10 0 0 0 6.99 3.34'/%3E%3Cpath d='M4 6h.01'/%3E%3Cpath d='M2.29 9.62A10 10 0 1 0 21.31 8.35'/%3E%3Cpath d='M16.24 7.76A6 6 0 1 0 8.23 16.67'/%3E%3Cpath d='M12 18h.01'/%3E%3Cpath d='M17.99 11.66A6 6 0 0 1 15.77 16.67'/%3E%3Ccircle cx='12' cy='12' r='2'/%3E%3Cpath d='m13.41 10.59 5.66-5.66'/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo" data-icon="radar"></span>UniFi Sonar</div>
    <nav class="nav" aria-label="Hoofdmenu">
      <a href="#/overzicht" data-route="overzicht"><span data-icon="activity"></span>Overzicht</a>
      <a href="#/issues" data-route="issues"><span data-icon="alert"></span>Issues <span class="count" id="nav-issues">–</span></a>
      <a href="#/apparaten" data-route="apparaten"><span data-icon="router"></span>Apparaten</a>
      <a href="#/clients" data-route="clients"><span data-icon="laptop"></span>Clients</a>
      <a href="#/internet" data-route="internet"><span data-icon="gauge"></span>Internet</a>
      <a href="#/beveiliging" data-route="beveiliging"><span data-icon="shield"></span>Beveiliging</a>
      <a href="#/tijdlijn" data-route="tijdlijn"><span data-icon="clock"></span>Tijdlijn</a>
    </nav>
    <div class="spacer"></div>
    <div class="status-pill" id="status" role="status" aria-live="polite"><span class="dot off"></span>Verbinden…</div>
    <a href="#/instellingen" class="iconlink" data-route="instellingen" aria-label="Instellingen" title="Instellingen"><span data-icon="settings"></span></a>
  </header>

  <main id="view" tabindex="-1"></main>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true">
    <div class="drawer-head">
      <span class="ico" id="drawer-icon"></span>
      <div style="min-width:0;flex:1">
        <h2 id="drawer-title" style="margin:0"></h2>
        <div class="muted" id="drawer-sub" style="font-size:13px"></div>
      </div>
      <button class="btn ghost" id="drawer-close" aria-label="Sluiten"><span data-icon="x"></span></button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
